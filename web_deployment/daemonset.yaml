apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    debug

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/logging-agent-*.log
        Tag               kube.*
        multiline.parser  docker, cri
        Refresh_Interval  10

    [OUTPUT]
        Name   stdout
        Match  *
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logging-agent
  namespace: logging
  labels:
    app: logging
spec:
  selector:
    matchLabels:
      app: logging
  template:
    metadata:
      labels:
        app: logging
    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: dockercontainers            
              mountPath: /var/lib/docker/containers 
              readOnly: true                        
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: dockercontainers          
          hostPath:               
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluent-bit-config