---
# handlers file for tasks

- name: Riavvia Elasticsearch
  community.docker.docker_container:
    name: "{{ elasticsearch_container_name }}"
    state: started
    restart: true

- name: Riavvia Grafana
  community.docker.docker_container:
    name: "{{ grafana_container_name }}"
    state: started
    restart: true

- name: Riavvia Prometheus
  community.docker.docker_container:
    name: "{{ prometheus_container_name }}"
    state: started
    restart: true

- name: Riavvia node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    scope: user
    state: restarted
    daemon_reload: true
  become_user: "{{ node_exporter_user }}"
