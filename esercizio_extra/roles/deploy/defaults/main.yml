---
# Elasticsearch
elasticsearch_image: docker.elastic.co/elasticsearch/elasticsearch
elasticsearch_tag: "9.5.4"
elasticsearch_container_name: elasticsearch
elasticsearch_port: 9200
elasticsearch_volume: elasticsearch-data
elasticsearch_heap: 1g
elasticsearch_jvm_options_dir: /opt/elasticsearch/jvm.options.d

# Grafana
grafana_image: grafana/grafana
grafana_tag: "13.2.2"
grafana_container_name: grafana
grafana_port: 3000
grafana_volume: grafana-data
grafana_provisioning_dir: /opt/grafana/provisioning
grafana_admin_user: admin
grafana_admin_password: "{{ vault_grafana_admin_password }}"
grafana_prometheus_url: "http://{{ hostvars[groups['monitoring-prometheus'][0]].ansible_host }}:{{ prometheus_port }}"
grafana_dashboard_id: 1860
grafana_dashboard_revision: 45

# Prometheus
prometheus_image: prom/prometheus
prometheus_tag: "v3.14.0"
prometheus_container_name: prometheus
prometheus_port: 9090
prometheus_volume: prometheus-data
prometheus_config_dir: /opt/prometheus
prometheus_scrape_interval: 15s
prometheus_retention: 15d

# node_exporter
node_exporter_version: "1.12.1"
node_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
node_exporter_user: vagrant
node_exporter_bin: /usr/local/bin/node_exporter
node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
node_exporter_ports:
  elasticsearch-host: 9100
  monitoring-grafana: 9101
  monitoring-prometheus: 9102